name: Release CDN maintenance

on:
  workflow_dispatch:
    inputs:
      certificate_id:
        description: Existing issued certificate to activate (empty inspects only)
        type: string
        default: ''
      refresh_version:
        description: Native 2.x version whose package URLs should be refreshed (empty skips)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-cdn-certificate
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python swift/Scripts/test-release-cdn.py
      - run: python -m pip install tencentcloud-sdk-python==3.1.193
      - name: Inspect or activate an existing matching certificate
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CERTIFICATE_ID: ${{ inputs.certificate_id }}
          REFRESH_VERSION: ${{ inputs.refresh_version }}
        run: python swift/Scripts/inspect-release-cdn.py
