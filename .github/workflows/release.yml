name: Native Release

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      mode:
        description: Verify packaging or publish the version in Info.plist
        type: choice
        options: [verify, publish]
        default: verify

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mini-tests:
    if: github.repository == 'buggyblues/Stash' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, macOS, ARM64, macmini, stash]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native tests on Mac mini
        run: |
          sw_vers
          swift --version
          xcrun --sdk macosx --show-sdk-version
          make test-headless

  package:
    needs: mini-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      STASH_RELEASE_ARCH: ${{ matrix.arch }}
      STASH_RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native tests
        run: make test
      - name: Import temporary signing credentials
        if: env.STASH_RELEASE_MODE == 'publish'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: bash swift/Scripts/ci-signing.sh
      - name: Build native ZIP and DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: swift/build/release/*
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: bash swift/Scripts/ci-cleanup-signing.sh

  publish:
    needs: package
    if: github.event_name == 'push' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install COS publisher
        run: python -m pip install cos-python-sdk-v5
      - name: Publish and verify versioned CDN artifacts
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: python swift/Scripts/publish-release.py release-artifacts
      - name: Publish native GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/bin/python3 -c "import plistlib; print(plistlib.load(open('swift/Scripts/Info.plist','rb'))['CFBundleShortVersionString'])")
          gh release create "v$version" --verify-tag --title "Stash $version · Native Swift" --notes-file "docs/releases/$version.md" release-artifacts/*.zip release-artifacts/*.dmg release-artifacts/SHA256SUMS release-artifacts/manifest-*.json
